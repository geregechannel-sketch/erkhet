name: Package UBCab v0.29.8 RACE Build Installer

on:
  push:
    branches: [ubcab-v0297-full]
    paths:
      - 'ubcab-v0298-race-installer/**'
      - '.github/workflows/package-ubcab-v0298-race.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ubcab-v0297-full

      - name: Package Windows build installer
        run: |
          set -eux
          mkdir -p releases /tmp/ubcab298
          cp ubcab-v0298-race-installer/START_HERE_v0.29.8_RACE.bat /tmp/ubcab298/
          cp ubcab-v0298-race-installer/BUILD_AND_INSTALL_v0.29.8_RACE.ps1 /tmp/ubcab298/
          cp ubcab-v0298-race-installer/README_FIRST.txt /tmp/ubcab298/
          (cd /tmp/ubcab298 && zip -q -r "$GITHUB_WORKSPACE/releases/UBCabOrderHelper-v0.29.8-RACE-Build-Installer.zip" .)
          (cd releases && sha256sum UBCabOrderHelper-v0.29.8-RACE-Build-Installer.zip > UBCabOrderHelper-v0.29.8-RACE-Build-Installer-SHA256.txt)

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: UBCabOrderHelper-v0.29.8-RACE-Build-Installer
          path: releases/UBCabOrderHelper-v0.29.8-RACE-Build-Installer.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit installer artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/UBCabOrderHelper-v0.29.8-RACE-Build-Installer.zip releases/UBCabOrderHelper-v0.29.8-RACE-Build-Installer-SHA256.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Package UBCab v0.29.8 RACE build installer [skip ci]'
          git push origin HEAD:ubcab-v0297-full
